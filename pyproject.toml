[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-data-mcp"
description = "A Model Context Protocol server exposing safe, validated tools over local data sources."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "mcp>=1.2.0",
    # Declared directly because we import it in config.py. It also ships as a
    # transitive dependency of `mcp`, but we depend on what we import.
    "pydantic>=2",
    # Google Workspace auth (F4). google-auth handles credentials + refresh;
    # google-auth-oauthlib provides the one-time interactive browser flow.
    # google-api-python-client is intentionally NOT here yet — it's for making
    # Sheets/Docs API calls and arrives with the first adapter (F5).
    "google-auth>=2",
    "google-auth-oauthlib>=1",
    # The official client for calling the Sheets/Docs APIs. Added now (F5)
    # because this is the first feature that actually makes API calls.
    "google-api-python-client>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Tools for building the per-OS Desktop Extensions (scripts/build_extension.py).
# uv does the cross-platform dependency vendoring; see the build docs in README.
build = [
    "uv>=0.4",
]

# `python -m local_data_mcp` is the command Claude Desktop will launch.
# We also expose a console script for convenience during local development.
[project.scripts]
local-data-mcp = "local_data_mcp.server:main"
# One-time interactive Google authorization, run by hand in a terminal.
local-data-mcp-authorize = "local_data_mcp.google_workspace.auth:main"

[tool.setuptools.packages.find]
where = ["src"]

# Single source of truth for the version: local_data_mcp/__init__.py.
[tool.setuptools.dynamic]
version = { attr = "local_data_mcp.__version__" }
